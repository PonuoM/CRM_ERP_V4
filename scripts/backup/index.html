<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>สำรอง ERP (เครื่องออฟฟิศเท่านั้น)</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; color: #111; }
    button { margin-right: .5rem; margin-top: .25rem; padding: .4rem .8rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { background: #f4f4f5; padding: 1rem; overflow: auto; font-size: 12px; max-height: 240px; white-space: pre-wrap; }
    pre[hidden] { display: none; }
    .warn { color: #9a3412; }
    .meta { color: #52525b; font-size: 14px; }
    .bar { height: 12px; background: #e4e4e7; border-radius: 6px; overflow: hidden; margin: .5rem 0 1rem; }
    .bar > span { display: block; height: 100%; background: #2563eb; width: 0%; transition: width .25s; }
    .bar.indet > span { width: 28%; animation: slide 1.2s ease-in-out infinite; }
    .bar.done > span { background: #16a34a; }
    .bar.err > span { background: #dc2626; width: 100%; }
    @keyframes slide { 0% { margin-left: 0; } 50% { margin-left: 72%; } 100% { margin-left: 0; } }
    #phase { font-weight: 600; margin: .75rem 0 .25rem; }
    ul { padding-left: 1.2rem; }
    li { margin: .35rem 0; }
  </style>
</head>
<body>
  <h1>สำรองฐานข้อมูล — เครื่องออฟฟิศ</h1>
  <p class="warn">อย่าอัปโฟลเดอร์นี้ขึ้น public_html / mini_erp โฮสต์ไม่มี mysqldump</p>
  <p>ใส่คีย์ใน <code>.env</code> ที่รากโปรเจกต์ (คัดลอกจาก <code>.env.example</code>) ไม่ใช่ในโฟลเดอร์นี้ ยกเว้นจะ overlay พาธ XAMPP</p>
  <p>
    <button id="dump" type="button">Dump</button>
    <button id="refresh" type="button">รีเฟรช</button>
  </p>
  <p id="phase"></p>
  <div class="bar" id="bar" hidden><span id="barfill"></span></div>
  <div id="status"></div>
  <pre id="log" hidden></pre>
  <script>
    let busy = false;
    let lastJobId = '';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"'`]/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': ''
      }[c]));
    }

    function mb(n) {
      const v = Number(n) || 0;
      return (v / 1048576).toFixed(1) + ' MB';
    }

    async function j(path, opt) {
      const r = await fetch(path, opt);
      let data = null;
      try {
        data = await r.json();
      } catch (e) {
        throw new Error('ตอบกลับไม่ใช่ JSON (HTTP ' + r.status + ')');
      }
      if (!r.ok && data && data.message) {
        const err = new Error(data.message);
        err.status = r.status;
        throw err;
      }
      if (!r.ok) {
        throw new Error('HTTP ' + r.status);
      }
      return data;
    }

    function showError(e) {
      const log = document.getElementById('log');
      log.hidden = false;
      log.textContent = (e && e.message) ? e.message : String(e);
    }

    function setBusy(on) {
      busy = !!on;
      document.getElementById('dump').disabled = busy;
      document.querySelectorAll('button[data-file]').forEach((b) => { b.disabled = busy; });
    }

    function renderJob(job) {
      const phaseEl = document.getElementById('phase');
      const bar = document.getElementById('bar');
      const fill = document.getElementById('barfill');
      const log = document.getElementById('log');
      if (!job) {
        if (!busy) {
          phaseEl.textContent = '';
          bar.hidden = true;
          document.getElementById('log').hidden = true;
        }
        return;
      }
      const running = job.status === 'running';
      const labels = {
        dump: 'กำลัง dump',
        gzip: 'กำลังบีบอัด',
        upload: 'กำลังอัป Google Drive',
        done: 'เสร็จแล้ว',
        error: 'ผิดพลาด'
      };
      let label = labels[job.phase] || job.phase || '';
      if (job.type === 'dump' && running) {
        label = 'กำลัง dump — ' + mb(job.bytes)
          + (job.total_bytes ? ' / ประมาณ ' + mb(job.total_bytes) : '');
        if (job.percent != null) label += ' (~' + job.percent + '% จากไฟล์รอบก่อน)';
      }
      if (job.type === 'upload' && running) {
        if (job.skipped) {
          label = 'พบไฟล์บน Drive แล้ว — ไม่ต้องอัปซ้ำ';
        } else if (!(job.bytes > 0)) {
          label = 'กำลังเช็ค Drive / เตรียมอัป — ไฟล์ ' + mb(job.total_bytes);
        } else {
          label = 'กำลังอัป Drive — ' + mb(job.bytes)
            + (job.total_bytes ? ' / ' + mb(job.total_bytes) : '');
          if (job.percent != null) label += ' ' + job.percent + '%';
          if (job.speed) label += ' · ' + job.speed;
          if (job.eta) label += ' · ETA ' + job.eta;
        }
        if (job.started_at) {
          const sec = Math.max(0, Math.round((Date.now() - Date.parse(job.started_at)) / 1000));
          if (!Number.isNaN(sec)) label += ' · ' + sec + ' วินาที';
        }
      }
      if (job.status === 'done') {
        if (job.type === 'upload' && job.skipped) {
          label = 'มีบน Drive แล้ว ไม่ได้อัปซ้ำ' + (job.file ? ' — ' + job.file : '');
        } else {
          label = (job.type === 'upload' ? 'อัป Drive เสร็จ' : 'Dump เสร็จ') + (job.file ? ' — ' + job.file : '');
        }
      }
      if (job.status === 'error') {
        label = 'ผิดพลาด: ' + (job.error || 'ไม่ทราบสาเหตุ');
      }
      phaseEl.textContent = label;
      bar.hidden = false;
      bar.className = 'bar'
        + (job.status === 'done' ? ' done' : '')
        + (job.status === 'error' ? ' err' : '')
        + (running && (job.percent == null || job.percent < 1) ? ' indet' : '');
      const pct = job.status === 'error' ? 100
        : job.status === 'done' ? 100
        : Math.max(0, Math.min(100, Number(job.percent) || 0));
      fill.style.width = (running && (job.percent == null || job.percent < 1) ? 32 : pct) + '%';
      const text = job.error || job.log || '';
      log.textContent = text;
      log.hidden = !text;
    }

    function bindUploads() {
      document.querySelectorAll('button[data-file]').forEach((b) => {
        b.disabled = busy;
        b.onclick = async () => {
          if (busy) return;
          try {
            const body = new URLSearchParams({ action: 'upload', file: b.dataset.file });
            const res = await j('/api.php?action=upload&file=' + encodeURIComponent(b.dataset.file), {
              method: 'POST',
              body
            });
            lastJobId = (res.job && res.job.id) || '';
            setBusy(true);
            renderJob(res.job);
            await tick();
          } catch (e) {
            showError(e);
          }
        };
      });
    }

    async function tick() {
      try {
        const s = await j('/api.php?action=status');
        const jobBusy = !!s.busy;
        setBusy(jobBusy);
        document.getElementById('status').innerHTML =
          '<p class="meta">โฟลเดอร์: ' + esc(s.workdir) + '</p>' +
          '<p class="meta">.env: ' + (s.env_present ? 'มี' : 'ยังไม่มี') + '</p>' +
          '<p class="meta">rclone: ' + esc(s.rclone_dest || 'ยังไม่ตั้ง — อัป Drive ด้วยมือได้') + '</p>' +
          '<ul>' + (s.files || []).map((f) =>
            '<li>' + esc(f.name) + ' (' + Math.round((f.size || 0) / 1048576) + ' MB) ' +
            '<button type="button" data-file="' + esc(f.name) + '"' + (jobBusy ? ' disabled' : '') +
            '>อัป Drive (rclone)</button></li>'
          ).join('') + '</ul>';
        bindUploads();
        renderJob(s.job);
        if (s.job && s.job.id) lastJobId = s.job.id;
      } catch (e) {
        showError(e);
      }
    }

    document.getElementById('dump').onclick = async () => {
      if (busy) return;
      document.getElementById('log').textContent = 'เริ่ม dump…';
      try {
        const res = await j('/api.php?action=dump', { method: 'POST' });
        lastJobId = (res.job && res.job.id) || '';
        setBusy(true);
        renderJob(res.job);
        await tick();
      } catch (e) {
        showError(e);
      }
    };
    document.getElementById('refresh').onclick = () => { tick(); };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
